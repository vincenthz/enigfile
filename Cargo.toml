[package]
name = "enigfile"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4", features = ["derive"] }
cryptoxide = "0.5"
thiserror = "2"
getrandom = "0.4"
anyhow = "1"
inquire = "0.6"
indicatif = "0.18"
